# Lint settings when tools run from the repo root (`make lint`). Keep in sync with
# python/pyproject.toml.
[tool.black]
line-length = 100
# Generated by `make generate` (buf); never edit or reformat by hand.
extend-exclude = "^/python/(buf|trainmesh)/"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
