// JobSpec is the single schema of a TrainMesh training job (YAML config `version: 1`).
//
// The Go CLI and the Python runtime both generate their types from this file and both enforce
// the buf.validate rules below, so a config is judged by one rule set wherever it is loaded.
// Zero values mean "use the default" unless a field is marked optional.
syntax = "proto3";

package trainmesh.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/trainmesh/trainmesh/internal/gen/trainmesh/v1;trainmeshv1";

message JobSpec {
  int32 version = 1 [(buf.validate.field).cel = {
    id: "version"
    message: "version must be 1"
    expression: "this == 1"
  }];
  Cluster cluster = 2;
  Run run = 3;
  Execution execution = 4 [(buf.validate.field).required = true];
  Training training = 5 [(buf.validate.field).required = true];
  // Free-form settings of the future adaptive planner (Phase 6). The legacy top-level
  // `optimizer:` key is migrated here on load.
  google.protobuf.Struct planner = 6;
}

message Cluster {
  string name = 1;
}

message Run {
  string name = 1;
  // Seed for model init, data generation and sampling. Unset means 42.
  optional int64 seed = 2;
  // Checkpoint directory to resume from; the CLI --resume flag overrides it.
  string resume = 3;
  // Rank 0 writes the result JSON here when set.
  string results_path = 4;
}

message Execution {
  option (buf.validate.message).cel = {
    id: "execution.diloco.islands"
    message: "execution.workers must be a multiple of execution.diloco.machines_per_island"
    expression: "this.strategy != 'diloco' || this.workers % (this.diloco.machines_per_island > 1 ? this.diloco.machines_per_island : 1) == 0"
  };
  option (buf.validate.message).cel = {
    id: "execution.diloco.min_islands"
    message: "execution.diloco.min_islands cannot exceed the number of islands (workers / machines_per_island)"
    expression: "this.strategy != 'diloco' || this.diloco.min_islands <= this.workers / (this.diloco.machines_per_island > 1 ? this.diloco.machines_per_island : 1)"
  };
  // data_parallel: every rank synchronises gradients every step (DDP or all-reduce).
  // diloco: ranks synchronise every step only inside their island; island leaders average
  // pseudo-gradients every diloco.inner_steps steps through tmcomm (made for slow links).
  string strategy = 1 [(buf.validate.field).cel = {
    id: "execution.strategy"
    message: "execution.strategy must be data_parallel or diloco"
    expression: "this in ['data_parallel', 'diloco']"
  }];
  // Machines in the job. The CLI can launch only 1 until the Phase 1 agent exists.
  int32 workers = 2 [(buf.validate.field).int32.gte = 1];
  int32 processes_per_worker = 3 [(buf.validate.field).int32.gte = 1];
  // Intra-op threads per rank; 0 means OMP_NUM_THREADS or 1.
  int32 cpu_threads_per_rank = 4 [(buf.validate.field).int32.gte = 0];
  Backend backend = 5 [(buf.validate.field).required = true];
  Rendezvous rendezvous = 6;
  // ddp: PyTorch DDP (overlaps communication with backward; CPU and CUDA only).
  // allreduce: one flattened all-reduce per optimizer step, staged through CPU memory when the
  // device cannot use the collective backend (MPS); needed for unequal per-rank batches.
  // Empty or auto: ddp when possible, otherwise allreduce.
  string gradient_sync = 7 [(buf.validate.field).cel = {
    id: "execution.gradient_sync"
    message: "execution.gradient_sync must be auto, ddp or allreduce"
    expression: "this in ['', 'auto', 'ddp', 'allreduce']"
  }];
  // Settings of strategy=diloco; ignored otherwise.
  Diloco diloco = 8;
}

// DiLoCo (Douillard et al., 2023): islands train independently for inner_steps optimizer steps,
// then average their pseudo-gradients (start-of-round weights minus current weights) and apply
// them with an outer Nesterov-momentum SGD step. Traffic between islands drops by inner_steps x
// compared with per-step synchronisation, and by a further 4x with int8 compression.
message Diloco {
  // Inner optimizer steps per outer round (H). 0 means 100.
  int32 inner_steps = 1 [(buf.validate.field).int32.gte = 0];
  // Outer SGD learning rate. Unset means 0.7 (the DiLoCo paper's value).
  optional double outer_learning_rate = 2 [(buf.validate.field).double = {gt: 0, lte: 10}];
  // Outer Nesterov momentum. Unset means 0.9.
  optional double outer_momentum = 3 [(buf.validate.field).double = {gte: 0, lt: 1}];
  // Pseudo-gradient encoding between islands: none (fp32), bf16 or int8. Empty means int8.
  // bf16 and int8 use error feedback, so what is dropped in one round is sent in the next.
  string compression = 4 [(buf.validate.field).cel = {
    id: "execution.diloco.compression"
    message: "execution.diloco.compression must be none, bf16 or int8"
    expression: "this in ['', 'none', 'bf16', 'int8']"
  }];
  // Machines that form one island (synchronised every step over a fast link). 0 means 1.
  int32 machines_per_island = 5 [(buf.validate.field).int32.gte = 0];
  // Islands that must contribute to every round for training to continue. 0 means a majority.
  int32 min_islands = 6 [(buf.validate.field).int32.gte = 0];
  // How long the root waits for every island's contribution. 0 means 120 s.
  double round_timeout_seconds = 7 [(buf.validate.field).double.gte = 0];
}

message Backend {
  option (buf.validate.message).cel = {
    id: "execution.backend.nccl_needs_cuda"
    message: "communication=nccl needs device=cuda (NCCL cannot move CPU or MPS tensors); use gloo or auto"
    expression: "this.communication != 'nccl' || this.device == 'cuda'"
  };
  // cpu, mps (Apple GPU), cuda (NVIDIA; AMD ROCm builds of PyTorch also report cuda), or auto:
  // each machine uses the best device it offers (cuda, then mps, then cpu).
  string device = 1 [(buf.validate.field).cel = {
    id: "execution.backend.device"
    message: "execution.backend.device must be cpu, mps, cuda or auto"
    expression: "this in ['cpu', 'mps', 'cuda', 'auto']"
  }];
  // gloo works with every device (MPS gradients are staged through CPU memory); nccl only with
  // cuda; auto lets the coordinator pick nccl when every chosen machine uses cuda, else gloo.
  string communication = 2 [(buf.validate.field).cel = {
    id: "execution.backend.communication"
    message: "execution.backend.communication must be gloo, nccl or auto"
    expression: "this in ['gloo', 'nccl', 'auto']"
  }];
}

// Informational today; the launcher always uses a static local rendezvous.
message Rendezvous {
  string backend = 1;
  string endpoint = 2;
}

message Training {
  Model model = 1;
  Dataset dataset = 2 [(buf.validate.field).required = true];
  Optimizer optimizer = 3;
  Batch batch = 4 [(buf.validate.field).required = true];
  int32 epochs = 5 [(buf.validate.field).int32.gt = 0];
  // Empty means fp32. bf16/fp16 use autocast (fp16 adds a gradient scaler). auto picks bf16 on
  // CUDA devices that support it and fp32 elsewhere: on the measured Apple CPU bf16 was 16x slower.
  string precision = 6 [(buf.validate.field).cel = {
    id: "training.precision"
    message: "training.precision must be fp32, bf16, fp16 or auto"
    expression: "this in ['', 'fp32', 'bf16', 'fp16', 'auto']"
  }];
  Checkpoint checkpoint = 7;
  Validation validation = 8;
}

message Model {
  // Empty means mlp.
  string type = 1 [(buf.validate.field).cel = {
    id: "training.model.type"
    message: "only training.model.type=mlp is supported"
    expression: "this in ['', 'mlp']"
  }];
  // Zero sizes fall back to the dataset sizes (input/output) or 64 (hidden).
  int32 input_size = 2 [(buf.validate.field).int32.gte = 0];
  int32 hidden_size = 3 [(buf.validate.field).int32.gte = 0];
  int32 output_size = 4 [(buf.validate.field).int32.gte = 0];
}

message Dataset {
  // synthetic: random labels, nothing to learn (throughput tests).
  // teacher: labels from a fixed random teacher network, learnable (accuracy tests).
  string type = 1 [(buf.validate.field).cel = {
    id: "training.dataset.type"
    message: "training.dataset.type must be synthetic or teacher"
    expression: "this in ['synthetic', 'teacher']"
  }];
  int32 samples = 2 [(buf.validate.field).int32.gt = 0];
  // Zero sizes mean 32 inputs and 4 classes.
  int32 input_size = 3 [(buf.validate.field).int32.gte = 0];
  int32 output_size = 4 [(buf.validate.field).int32.gte = 0];
}

message Optimizer {
  // Empty means adam.
  string name = 1 [(buf.validate.field).cel = {
    id: "training.optimizer.name"
    message: "training.optimizer.name must be adam or sgd"
    expression: "this in ['', 'adam', 'sgd']"
  }];
  // Zero means 0.001.
  double learning_rate = 2 [(buf.validate.field).double.gte = 0];
}

message Batch {
  // Samples per rank per micro-batch when every rank gets the same share. The global batch is
  // always per_rank x world_size x gradient_accumulation_steps.
  int32 per_rank = 1 [(buf.validate.field).int32.gt = 0];
  // Zero means 1.
  int32 gradient_accumulation_steps = 2 [(buf.validate.field).int32.gte = 0];
  // uniform (default): every rank gets per_rank. throughput: the coordinator splits the same
  // global batch in proportion to each machine's measured throughput.
  string balance = 3 [(buf.validate.field).cel = {
    id: "training.batch.balance"
    message: "training.batch.balance must be uniform or throughput"
    expression: "this in ['', 'uniform', 'throughput']"
  }];
  // Explicit per-rank micro-batch sizes in rank order, normally filled by the coordinator. Must
  // have one entry per rank and sum to per_rank x world_size.
  repeated int32 rank_batch_sizes = 4 [(buf.validate.field).repeated.items.int32.gt = 0];
}

message Checkpoint {
  // Unset means enabled.
  optional bool enabled = 1;
  // Empty means ./checkpoints.
  string directory = 2;
}

message Validation {
  // Held-out samples evaluated after every epoch; 0 disables validation.
  int32 samples = 1 [(buf.validate.field).int32.gte = 0];
}
