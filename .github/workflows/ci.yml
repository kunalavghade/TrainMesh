name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
      - run: go test -race -count=1 ./...

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .venv --python 3.12
      - name: Install CPU PyTorch and the runtime
        run: |
          uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -e 'python[dev]'
      - run: .venv/bin/ruff check python
      - run: .venv/bin/black --check python
      # The macOS runner's hostname takes 35-70 s to resolve, which stalls torchrun's rendezvous.
      - name: Resolve runner hostname locally
        if: runner.os == 'macOS'
        run: echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
      - run: PYTHONPATH=python .venv/bin/python -m pytest python/tests -q
