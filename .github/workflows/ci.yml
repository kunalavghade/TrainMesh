name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
      - run: go test -race -count=1 ./...

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .venv --python 3.12
      - name: Install CPU PyTorch and the runtime
        run: |
          uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -e 'python[dev]'
      - run: .venv/bin/ruff check python
      - run: .venv/bin/black --check python
      # The runner's `.local` hostname takes 35-70 s to resolve via mDNS, which stalls torchrun's
      # rendezvous. Use a plain name served from /etc/hosts (IPv4 and IPv6) and fail fast if slow.
      - name: Make the runner hostname resolve instantly
        if: runner.os == 'macOS'
        run: |
          sudo scutil --set HostName trainmesh-ci
          printf '127.0.0.1 trainmesh-ci\n::1 trainmesh-ci\n' | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder || true
          scutil --dns | grep -E "nameserver|search domain|resolver #" | head -12
          .venv/bin/python - <<'EOF'
          import socket, time
          host = socket.gethostname()
          def timed(label, fn):
              start = time.time()
              try:
                  result = fn()
              except Exception as exc:  # noqa: BLE001
                  result = f"ERROR {exc!r}"
              print(f"{label}: {time.time() - start:.2f}s -> {result}", flush=True)
          timed("getaddrinfo(host, AF_INET)", lambda: socket.getaddrinfo(host, None, socket.AF_INET)[:1])
          timed("getaddrinfo(host, AF_INET6)", lambda: socket.getaddrinfo(host, None, socket.AF_INET6)[:1])
          timed("gethostbyaddr('127.0.0.1')", lambda: socket.gethostbyaddr("127.0.0.1"))
          timed("gethostbyaddr('::1')", lambda: socket.gethostbyaddr("::1"))
          timed("gethostbyaddr(host)", lambda: socket.gethostbyaddr(host))
          start = time.time()
          print("getfqdn ->", socket.getfqdn(host))
          elapsed = time.time() - start
          print(f"getfqdn took {elapsed:.2f}s")
          raise SystemExit(elapsed > 2)
          EOF
      - run: PYTHONPATH=python .venv/bin/python -m pytest python/tests -q
