name: debug-macos

on:
  push:
    branches: ["ci/**"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .venv --python 3.12
      - run: |
          uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -e 'python[dev]'
      - name: Time hostname resolution
        run: |
          hostname; scutil --get LocalHostName || true; ifconfig lo0 | head -3
          .venv/bin/python - <<'EOF'
          import socket, time
          def timed(label, fn):
              start = time.time()
              try:
                  result = fn()
              except Exception as exc:  # noqa: BLE001
                  result = f"ERROR {exc!r}"
              print(f"{label}: {time.time() - start:.2f}s -> {result}", flush=True)
          timed("gethostname", socket.gethostname)
          timed("getfqdn", socket.getfqdn)
          timed("getaddrinfo(hostname)", lambda: socket.getaddrinfo(socket.gethostname(), None)[:2])
          timed("getaddrinfo(localhost)", lambda: socket.getaddrinfo("localhost", None)[:2])
          EOF
      - name: Two-rank test with verbose logs
        env:
          TORCH_CPP_LOG_LEVEL: INFO
          LOGLEVEL: INFO
        run: PYTHONPATH=python .venv/bin/python -m pytest python/tests/test_runtime.py -q -x -k two_rank
