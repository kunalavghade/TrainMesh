version: "2"

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # Best-effort writes of progress and warnings to the terminal.
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G204 # subprocess args come from validated config and discovered interpreter paths
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
