[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainmesh-runtime"
version = "0.2.0"
description = "CPU-first PyTorch distributed training runtime for TrainMesh"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "PyYAML>=6.0", "numpy>=1.26", "safetensors>=0.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6", "black>=24"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
