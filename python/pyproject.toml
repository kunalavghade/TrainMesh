[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainmesh-runtime"
version = "0.1.0"
description = "CPU-first PyTorch distributed training runtime for TrainMesh"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "PyYAML>=6.0", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
