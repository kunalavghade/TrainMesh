[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainmesh-runtime"
version = "0.5.0"
description = "CPU-first PyTorch distributed training runtime for TrainMesh"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "safetensors>=0.4",
    "protobuf>=7.36.2,<8",
    "protovalidate>=1.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6", "black>=24", "maturin>=1.9,<2"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
line-length = 100
# Generated by `make generate` (buf); never edit or reformat by hand.
extend-exclude = "^/(buf|trainmesh)/"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["buf", "trainmesh"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
